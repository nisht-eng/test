<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background:var(--surface)">
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html" aria-label="Home">
        <img src="assets/logo.svg" alt="" />
        <span class="logo-text">Simple News</span>
      </a>
    </div>
  </header>
  <main class="wrap" style="max-width:440px;margin:80px auto">
    <div class="auth-card">
      <h1>Admin Login</h1>
      <p>এই পাতা কেবল ডেমো ব্যবহারের জন্য। নিরাপত্তা নেই — প্রোডাকশনে ব্যবহার করবেন না।</p>
      <form id="login-form">
        <label>Username <input id="username" required></label>
        <label>Password <input id="password" type="password" required></label>
        <button type="submit">Log in</button>
        <div id="msg" style="margin-top:12px;color:var(--accent-dark)"></div>
      </form>
    </div>
  </main>

  <script src="config.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      if (u === ADMIN_CREDENTIALS.username && p === ADMIN_CREDENTIALS.password) {
        // simple token
        localStorage.setItem('admin_token', btoa(u + ':' + Date.now()));
        location.href = 'admin.html';
      } else {
        msg.textContent = 'Invalid credentials';
      }
    });
  </script>
</body>
</html>
