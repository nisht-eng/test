<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple News — খবর</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700;900&family=Hind+Siliguri:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="masthead-bar">
    <div class="wrap">
      <span><span class="wire-dot"></span>সরাসরি সংবাদ ফিড</span>
      <span id="masthead-date"></span>
    </div>
  </div>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html" aria-label="Home">
        <img src="assets/logo.svg" alt="" />
        <span class="logo-text">Simple<span class="accent"> News</span></span>
      </a>
      <form class="search" onsubmit="event.preventDefault(); document.getElementById('search-term').blur(); filterPosts();">
        <input id="search-term" placeholder="Search articles…" aria-label="Search" />
      </form>
      <nav class="main-nav">
        <a href="#">Tech</a>
        <a href="#">Reviews</a>
        <a href="#">Mobile</a>
        <a href="#">AI</a>
        <a href="login.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="wrap site-main">
    <section class="hero" id="hero">
      <!-- hero filled by JS -->
    </section>

    <div class="columns">
      <section class="content" id="article-grid">
        <!-- article cards by JS -->
      </section>

      <aside class="sidebar">
        <div class="widget">
          <h3>Trending</h3>
          <ul id="trending"></ul>
        </div>
        <div class="widget">
          <h3>Subscribe</h3>
          <p>নিউজলেটারে সাবস্ক্রাইব করতে ইমেইল দিন</p>
          <form id="sub-form"><input placeholder="আপনার ইমেইল" type="email" required><button>Subscribe</button></form>
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">© 2026 — Simple News</div>
  </footer>

  <script>
    document.getElementById('masthead-date').textContent =
      new Date().toLocaleDateString('bn-BD', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  </script>
  <script src="scripts.js"></script>
</body>
</html>
