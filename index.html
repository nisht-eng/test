<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Simple News — খবর</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="index.html" aria-label="Home">
      <img src="assets/logo.svg" alt="" />
      <span class="logo-text">Simple News</span>
    </a>
    <nav class="main-nav" id="main-nav">
      <a href="index.html?category=Domain" data-cat="Domain">Domain</a>
      <a href="index.html?category=Hosting" data-cat="Hosting">Hosting</a>
      <a href="index.html?category=Website" data-cat="Website">Website</a>
      <a href="index.html?category=Mobile" data-cat="Mobile">Mobile</a>
      <a href="index.html?category=Computer" data-cat="Computer">Computer</a>
      <a href="index.html?category=Freelancing" data-cat="Freelancing">Freelancing</a>
      <a href="index.html?category=SEO" data-cat="SEO">SEO</a>
    </nav>
    <form class="search" onsubmit="event.preventDefault(); document.getElementById('search-term').blur(); filterPosts();">
      <input id="search-term" placeholder="Search…" aria-label="Search" />
    </form>
  </div>
</header>

<main class="wrap site-main">
  <h1 class="category-heading" id="category-heading" style="display:none"></h1>

  <section class="top-grid" id="top-grid">
    <!-- featured post + 2x2 grid filled by JS -->
  </section>

  <section class="more-stories">
    <h2 class="section-label">Latest</h2>
    <div class="more-stories-layout">
      <div class="more-stories-main">
        <div id="more-stories-list">
          <!-- story rows filled by JS -->
        </div>
        <p id="empty-state" style="display:none;color:var(--muted)">কোনো পোস্ট পাওয়া যায়নি।</p>
        <nav class="pagination" id="pagination" aria-label="Pagination">
          <!-- pagination filled by JS -->
        </nav>
      </div>
      <aside class="home-sidebar" id="home-sidebar">
        <!-- sidebar filled by JS -->
      </aside>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-links">
      <a href="index.html">Latest</a>
      <a href="index.html?category=Domain">Domain</a>
      <a href="index.html?category=Hosting">Hosting</a>
      <a href="index.html?category=Website">Website</a>
      <a href="index.html?category=Mobile">Mobile</a>
      <a href="index.html?category=Computer">Computer</a>
      <a href="index.html?category=Freelancing">Freelancing</a>
      <a href="index.html?category=SEO">SEO</a>
      <a href="login.html">Admin</a>
    </div>
    <div class="footer-bottom">© 2026 Simple News. All Rights Reserved.</div>
  </div>
</footer>

<script src="scripts.js"></script>
</body>
</html>
