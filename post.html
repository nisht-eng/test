<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Post — Simple News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="index.html" aria-label="Home">
      <img src="assets/logo.svg" alt="" />
      <span class="logo-text">Simple News</span>
    </a>
    <nav class="main-nav">
      <a href="index.html?category=Domain">Domain</a>
      <a href="index.html?category=Hosting">Hosting</a>
      <a href="index.html?category=Website">Website</a>
      <a href="index.html?category=Mobile">Mobile</a>
      <a href="index.html?category=Computer">Computer</a>
      <a href="index.html?category=Freelancing">Freelancing</a>
      <a href="index.html?category=SEO">SEO</a>
    </nav>
  </div>
</header>

<main class="post-wrap">
  <div class="post-layout">
    <article id="post-article">
      <!-- post rendered by JS -->
    </article>
    <aside class="post-sidebar" id="post-sidebar">
      <!-- sidebar rendered by JS -->
    </aside>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="login.html">Admin</a>
    </div>
    <div class="footer-bottom">© 2026 Simple News. All Rights Reserved.</div>
  </div>
</footer>

<script>
  function q(selector){ return document.querySelector(selector); }
  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function getId(){ const u = new URL(location.href); return u.searchParams.get('id'); }

  function initials(name){
    return String(name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  }

  function renderSidebar(posts, currentId){
    const sidebar = q('#post-sidebar');
    if(!sidebar) return;

    const recent = posts
      .filter(p => String(p.id) !== String(currentId))
      .slice(0, 5);

    const categories = [...new Set(posts.map(p => p.category).filter(Boolean))];

    const recentHtml = recent.map(p => `
      <li>
        <a class="sidebar-post" href="post.html?id=${encodeURIComponent(p.id)}">
          <img src="${p.image||'https://via.placeholder.com/160x160?text=No+Image'}" alt="${escapeHtml(p.title)}">
          <div>
            <div class="kicker">${escapeHtml(p.category||'')}</div>
            <h4>${escapeHtml(p.title)}</h4>
          </div>
        </a>
      </li>
    `).join('');

    const categoriesHtml = categories.map(c => `
      <li><a href="index.html?category=${encodeURIComponent(c)}">${escapeHtml(c)}</a></li>
    `).join('');

    sidebar.innerHTML = `
      <div class="sidebar-widget">
        <h3>সাম্প্রতিক পোস্ট</h3>
        <ul class="sidebar-recent">${recentHtml || '<li>কোনো পোস্ট নেই</li>'}</ul>
      </div>
      <div class="sidebar-widget">
        <h3>ক্যাটাগরি</h3>
        <ul class="sidebar-categories">${categoriesHtml || '<li>কোনো ক্যাটাগরি নেই</li>'}</ul>
      </div>
    `;
  }

  async function loadPost(){
    const id = getId();
    const container = q('#post-article');
    if(!id){ container.innerHTML = '<p>Invalid post.</p>'; return; }
    try{
      const res = await fetch('posts.json', {cache:'no-store'});
      if(!res.ok) throw new Error('posts.json not found');
      const posts = await res.json();
      const post = posts.find(p => String(p.id) === String(id));
      if(!post){ container.innerHTML = '<p>Post not found.</p>'; return; }

      const html = `
        <div class="kicker post-kicker">${escapeHtml(post.category||'')}</div>
        <h1>${escapeHtml(post.title)}</h1>
        <div class="post-byline">
          <div class="avatar">${escapeHtml(initials(post.author))}</div>
          <div>By ${escapeHtml(post.author||'Admin')} • ${escapeHtml(post.date||'')}</div>
        </div>
        <img class="post-hero-img" src="${post.image||'https://via.placeholder.com/1200x600?text=No+Image'}" alt="${escapeHtml(post.title)}">
        <div class="post-content">${post.content||''}</div>
        <a class="post-back" href="index.html">← Back to home</a>
      `;
      container.innerHTML = html;
      renderSidebar(posts, post.id);
    }catch(err){ container.innerHTML = '<p>Error loading post.</p>'; console.error(err); }
  }

  loadPost();
</script>
</body>
</html>
